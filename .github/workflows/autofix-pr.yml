   name: Autofix (opens a PR, never pushes to main)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    # Skip on the bot's own commits to avoid an infinite loop of PRs
    if: github.actor != 'github-actions[bot]'
    defaults:
      run:
        working-directory: trading
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formatters/linters
        run: pip install ruff black

      - name: Auto-format Python files
        run: |
          black *.py || true
          ruff check --fix *.py || true

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      # This is the safety boundary: create_pull_request opens a PR for a
      # human to review and merge. It does NOT push to main, does NOT
      # merge automatically, and does NOT run again on its own output
      # (see the 'if:' guard above). If you ever consider changing this
      # step to push straight to main instead, don't - see the project's
      # notes on why autonomous unsupervised patches are excluded here.
      - name: Open PR with fixes
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Autofix: formatting and lint fixes'
          title: 'Automated formatting/lint fixes'
          body: |
            Automated fixes from `ruff` and `black`.

            **This PR was NOT auto-merged.** Review the diff before merging -
            automated formatters are usually safe, but this project keeps a
            human in the loop for every change, no exceptions.
          branch: autofix/lint-formatting
          delete-branch: true   
          # fix permissions
