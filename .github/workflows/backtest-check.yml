name: Backtest Regression Check

on:
  push:
    paths:
      - 'trading/backtest_engine.py'
      - 'trading/orchestration_schema.py'
      - 'trading/strategy_*.py'
      - 'trading/*.csv'
  pull_request:
    paths:
      - 'trading/backtest_engine.py'
      - 'trading/orchestration_schema.py'
      - 'trading/strategy_*.py'
      - 'trading/*.csv'
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pydantic

      - name: Run backtest and check thresholds
        run: python ci_backtest_check.py

      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: trading/backtest_report.txt
