name: Project Status Check

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pydantic

      - name: Run status check
        run: python project_status.py >> "$GITHUB_STEP_SUMMARY"
